name: validate-template

# Service Admin uses the service-template contract as its base and then layers app code on top.

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

env:
  SERVICE_LASSO_HARNESS_REPO: service-lasso/service-lasso-harness
  SERVICE_LASSO_HARNESS_VERSION: v0.1.1

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            archive_name: service-lasso-harness-windows-amd64.zip
            archive_sha256: 3152dad06fa1661bd96f077462de4057f4136b81fb41dabf5aa7fc9a1dc30daa
            extracted_dir: service-lasso-harness-windows-amd64
          - os: ubuntu-latest
            platform: linux
            archive_name: service-lasso-harness-linux-amd64.tar.gz
            archive_sha256: 71d59667a82bd4d9a0221b5e822ec722052b96f2168d1b4d7bce5bfce8540cb5
            extracted_dir: service-lasso-harness-linux-amd64
          - os: macos-14
            platform: darwin
            archive_name: service-lasso-harness-darwin-arm64.tar.gz
            archive_sha256: 8f9c69057b4eb26902c8e69da7c183fafffc7382f90688b8566769267704673c
            extracted_dir: service-lasso-harness-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Download released service-lasso-harness binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .harness/download .harness/bin
          gh release download "$SERVICE_LASSO_HARNESS_VERSION" \
            --repo "$SERVICE_LASSO_HARNESS_REPO" \
            --pattern "${{ matrix.archive_name }}" \
            --dir .harness/download

      - name: Verify released harness digest
        shell: pwsh
        run: |
          $archive = ".harness/download/${{ matrix.archive_name }}"
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '${{ matrix.archive_sha256 }}'
          if ($actual -ne $expected) {
            throw "Harness digest mismatch for $archive. Expected $expected, got $actual."
          }

      - name: Extract released harness binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path ".harness/download/${{ matrix.archive_name }}" -DestinationPath ".harness/bin" -Force
          $harness = Get-ChildItem -Recurse .harness/bin -File | Where-Object { $_.Name -in @('service-lasso-harness.exe', 'service-lasso-harness') } | Select-Object -First 1
          if (-not $harness) { throw 'service-lasso-harness binary not found after extraction' }
          Add-Content -Path $env:GITHUB_PATH -Value $harness.DirectoryName
          Add-Content -Path $env:GITHUB_ENV -Value ("SERVICE_LASSO_HARNESS_BIN=" + $harness.FullName)

      - name: Extract released harness binary (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf ".harness/download/${{ matrix.archive_name }}" -C .harness/bin
          HARNESS_BIN="$(find .harness/bin -type f \( -name 'service-lasso-harness' -o -name 'service-lasso-harness.exe' \) | head -n 1)"
          if [[ -z "$HARNESS_BIN" ]]; then
            echo "service-lasso-harness binary not found after extraction" >&2
            exit 1
          fi
          chmod +x "$HARNESS_BIN" || true
          echo "$PWD/$(dirname "$HARNESS_BIN")" >> "$GITHUB_PATH"
          echo "SERVICE_LASSO_HARNESS_BIN=$PWD/$HARNESS_BIN" >> "$GITHUB_ENV"

      - name: Package service artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Package service artifact (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/package.sh

      - name: Run service tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Run service tests (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/test.sh

      - name: Verify via released harness (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Verify via released harness (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/verify.sh
