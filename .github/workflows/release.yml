name: Release

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      fixture_input_pairs:
        description: Separately admitted per-OS sender and receiver ROOT paths and SHA JSON
        required: true
        type: string
      candidate_sha:
        description: Exact protected develop commit to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: authorize-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Bind dispatch to protected develop head
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/develop"
          test "${CANDIDATE_SHA}" = "${GITHUB_SHA}"

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject production dependency vulnerabilities
        run: pnpm audit --prod
      - name: Reject critical and high tooling vulnerabilities
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        id: format_check
        run: pnpm format:check
      - name: Record canonical projections of the two failed public fixtures
        if: failure() && steps.format_check.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          printf 'FORMAT-DIAGNOSTIC-HEAD '
          git rev-parse HEAD
          printf 'FORMAT-DIAGNOSTIC-VERSION '
          pnpm exec prettier --version
          for file in tests/source-admission-build-callbacks.node.mjs tests/source-admission-proxy.node.mjs; do
            printf 'FORMAT-DIAGNOSTIC-ORIGINAL %s ' "$file"
            git hash-object "$file"
            printf 'FORMAT-DIAGNOSTIC-BEGIN %s\n' "$file"
            pnpm exec prettier "$file"
            printf 'FORMAT-DIAGNOSTIC-END %s\n' "$file"
          done
      - name: Run unit tests
        run: pnpm test:unit
      - name: Install Chromium for browser qualification
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser qualification
        run: pnpm test:ui
      - name: Install Cypress
        run: pnpm exec cypress install
      - name: Run readiness diagnostic browser fixture
        run: pnpm test:secrets:readiness-diagnostic
      - name: Build UI
        run: pnpm build

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            artifact: output/release/@serviceadmin-win32.zip
            sbom: output/release/serviceadmin-win32.cdx.json
          - os: ubuntu-latest
            platform: linux
            artifact: output/release/@serviceadmin-linux.tar.gz
            sbom: output/release/serviceadmin-linux.cdx.json
          - os: macos-14
            platform: darwin
            artifact: output/release/@serviceadmin-darwin.tar.gz
            sbom: output/release/serviceadmin-darwin.cdx.json
    runs-on: ${{ matrix.os }}
    env:
      SERVICE_LASSO_TEST_SENDER_ARTIFACT_ROOT: ${{ fromJSON(inputs.fixture_input_pairs || '{}')[matrix.platform].root }}
      SERVICE_LASSO_TEST_SENDER_ARTIFACT_ROOT_SHA256: ${{ fromJSON(inputs.fixture_input_pairs || '{}')[matrix.platform].sha256 }}
      SERVICE_LASSO_TEST_RECEIVER_TOOL_ROOT: ${{ fromJSON(inputs.fixture_input_pairs || '{}')[matrix.platform].receiverRoot }}
      SERVICE_LASSO_TEST_RECEIVER_TOOL_ROOT_SHA256: ${{ fromJSON(inputs.fixture_input_pairs || '{}')[matrix.platform].receiverSHA256 }}
      SERVICE_LASSO_TEST_RECEIVER_SOURCE_EVIDENCE_DIR: ${{ fromJSON(inputs.fixture_input_pairs || '{}')[matrix.platform].receiverSourceEvidence }}
      SERVICE_LASSO_TEST_RECEIVER_EXTRACTED_EVIDENCE_DIR: ${{ fromJSON(inputs.fixture_input_pairs || '{}')[matrix.platform].receiverExtractedEvidence }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test runtime
        run: pnpm test:runtime
      - name: Build UI
        run: pnpm build
      - name: Package artifact
        run: pnpm package:artifact -- ${{ matrix.platform }}
      - name: Verify extracted artifact
        run: pnpm package:verify -- ${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serviceadmin-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.sbom }}
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    needs:
      - authorize
      - quality
      - package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: serviceadmin-*
          merge-multiple: true
      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          cp service.json release-assets/service.json
          (
            cd release-assets
            sha256sum @serviceadmin-win32.zip @serviceadmin-linux.tar.gz @serviceadmin-darwin.tar.gz serviceadmin-win32.cdx.json serviceadmin-linux.cdx.json serviceadmin-darwin.cdx.json service.json > SHA256SUMS.txt
          )
          short_sha="${GITHUB_SHA::7}"
          version="$(date -u +%Y.%-m.%-d)-${short_sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Attest exact release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/@serviceadmin-win32.zip
            release-assets/@serviceadmin-linux.tar.gz
            release-assets/@serviceadmin-darwin.tar.gz
            release-assets/serviceadmin-win32.cdx.json
            release-assets/serviceadmin-linux.cdx.json
            release-assets/serviceadmin-darwin.cdx.json
            release-assets/service.json
            release-assets/SHA256SUMS.txt
      - name: Verify signed provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            @serviceadmin-win32.zip
            @serviceadmin-linux.tar.gz
            @serviceadmin-darwin.tar.gz
            serviceadmin-win32.cdx.json
            serviceadmin-linux.cdx.json
            serviceadmin-darwin.cdx.json
            service.json
            SHA256SUMS.txt
          )
          for asset in "${assets[@]}"; do
            gh attestation verify "release-assets/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" >/dev/null
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists and is immutable." >&2
            exit 1
          fi
          gh release create "$tag" \
            release-assets/@serviceadmin-win32.zip \
            release-assets/@serviceadmin-linux.tar.gz \
            release-assets/@serviceadmin-darwin.tar.gz \
            release-assets/serviceadmin-win32.cdx.json \
            release-assets/serviceadmin-linux.cdx.json \
            release-assets/serviceadmin-darwin.cdx.json \
            release-assets/service.json \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Release-grade Service Admin UI artifacts."
      - name: Verify immutable release readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.version }}"
          release_json="$(gh release view "$tag" --json tagName,name,targetCommitish,isDraft,isPrerelease,assets)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$tag"
          test "$(jq -r '.name' <<<"$release_json")" = "$tag"
          test "$(jq -r '.targetCommitish' <<<"$release_json")" = "$GITHUB_SHA"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = "false"
          assets=(
            @serviceadmin-win32.zip
            @serviceadmin-linux.tar.gz
            @serviceadmin-darwin.tar.gz
            serviceadmin-win32.cdx.json
            serviceadmin-linux.cdx.json
            serviceadmin-darwin.cdx.json
            service.json
            SHA256SUMS.txt
          )
          test "$(jq '.assets | length' <<<"$release_json")" -eq "${#assets[@]}"
          for asset in "${assets[@]}"; do
            local_digest="$(sha256sum "release-assets/$asset" | cut -d' ' -f1)"
            remote_digest="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            remote_size="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
            test "$remote_digest" = "sha256:${local_digest}"
            test "$remote_size" -gt 0
          done
