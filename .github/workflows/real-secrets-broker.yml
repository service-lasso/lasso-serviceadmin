name: Real Secrets Broker Browser Qualification

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      core_ref:
        description: Exact Service Lasso Core branch, tag, or SHA to qualify
        required: true
        default: develop
        type: string
      broker_ref:
        description: Exact Secrets Broker branch, tag, or SHA to qualify
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  real-secrets-browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            admin_platform: win32
            broker_binary: secretsbroker.exe
          - os: ubuntu-latest
            admin_platform: linux
            broker_binary: secretsbroker
          - os: macos-14
            admin_platform: darwin
            broker_binary: secretsbroker
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Service Admin candidate
        uses: actions/checkout@v5
      - name: Checkout Service Lasso Core develop
        uses: actions/checkout@v5
        with:
          repository: service-lasso/service-lasso
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.core_ref || 'develop' }}
          path: qualification/core
      - name: Checkout Secrets Broker main
        uses: actions/checkout@v5
        with:
          repository: service-lasso/lasso-secretsbroker
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.broker_ref || 'main' }}
          path: qualification/broker
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
      - name: Record exact dependency revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "SERVICE_LASSO_TEST_CORE_REVISION=$(git -C qualification/core rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_TEST_BROKER_REVISION=$(git -C qualification/broker rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build Secrets Broker
        shell: bash
        working-directory: qualification/broker
        run: |
          set -euo pipefail
          mkdir -p output
          go build -trimpath -o "output/${{ matrix.broker_binary }}" ./cmd/secretsbroker
      - name: Build Service Lasso Core
        working-directory: qualification/core
        run: |
          npm ci
          npm run build
      - name: Install and qualify Service Admin candidate
        shell: bash
        env:
          SERVICE_LASSO_TEST_CORE_ROOT: ${{ github.workspace }}/qualification/core
          SERVICE_LASSO_TEST_BROKER_BINARY: ${{ github.workspace }}/qualification/broker/output/${{ matrix.broker_binary }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec cypress install
          pnpm audit --prod
          pnpm build
          pnpm package:artifact -- "${{ matrix.admin_platform }}"
          pnpm package:verify -- "${{ matrix.admin_platform }}"
          pnpm test:secrets:real-first-run-browser
          pnpm test:secrets:real-browser
          pnpm test:secrets:real-lockout-browser
