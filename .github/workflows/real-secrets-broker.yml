name: Real Secrets Broker Browser Qualification

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-secrets-browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            admin_platform: win32
            broker_binary: secretsbroker.exe
          - os: ubuntu-latest
            admin_platform: linux
            broker_binary: secretsbroker
          - os: macos-14
            admin_platform: darwin
            broker_binary: secretsbroker
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Service Admin candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned Service Lasso Core revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: service-lasso/service-lasso
          # This is a source candidate, not an immutable published Core
          # baseline. Publication and per-OS asset checksum evidence remain a
          # separate release-owner prerequisite.
          ref: 84c359d84d1bea0fec1694e14d9d75e6090c07f4
          path: qualification/core
      - name: Checkout pinned Secrets Broker revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: service-lasso/lasso-secretsbroker
          ref: f340883056ec3cf74b535fb46490b39382e8c823
          path: qualification/broker
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
      - name: Record exact dependency revisions
        id: dependency_revisions
        shell: bash
        run: |
          set -euo pipefail
          admin_revision="$(git rev-parse HEAD)"
          core_revision="$(git -C qualification/core rev-parse HEAD)"
          core_tree="$(git -C qualification/core rev-parse HEAD^{tree})"
          broker_revision="$(git -C qualification/broker rev-parse HEAD)"
          echo "admin_revision=$admin_revision" >> "$GITHUB_OUTPUT"
          echo "SERVICE_LASSO_TEST_CORE_REVISION=$core_revision" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_TEST_SOURCE_HEAD=$core_revision" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_TEST_SOURCE_TREE=$core_tree" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_TEST_CORE_QUALIFICATION_KIND=source_candidate" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_TEST_BROKER_REVISION=$broker_revision" >> "$GITHUB_ENV"
          echo "core_revision=$core_revision" >> "$GITHUB_OUTPUT"
          echo "broker_revision=$broker_revision" >> "$GITHUB_OUTPUT"
      - name: Initialize private native qualification custody
        shell: bash
        env:
          # These are literal, distinct process paths established before a build
          # or test can start. The custody sidecar hashes them; it never publishes them.
          SERVICE_LASSO_WORKSPACE_ROOT: ${{ runner.temp }}/service-lasso-qualification/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.admin_platform }}/workspace
          SERVICE_LASSO_TEST_REGISTRIES_ROOT: ${{ runner.temp }}/service-lasso-qualification/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.admin_platform }}/registries
          SERVICE_LASSO_INSTANCE_REGISTRY_PATH: ${{ runner.temp }}/service-lasso-qualification/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.admin_platform }}/registries/instances.json
          SERVICE_LASSO_HOST_PORT_REGISTRY_PATH: ${{ runner.temp }}/service-lasso-qualification/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.admin_platform }}/registries/host-ports.json
          SERVICE_LASSO_TEST_SERVICES_ROOT: ${{ runner.temp }}/service-lasso-qualification/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.admin_platform }}/services
          SERVICE_LASSO_TEST_EVIDENCE_ROOT: ${{ runner.temp }}/service-lasso-qualification/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.admin_platform }}/evidence
          SERVICE_LASSO_TEST_SUPPORT_ROOT: ${{ runner.temp }}/service-lasso-qualification/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.admin_platform }}/support
          SERVICE_LASSO_QUALIFICATION_CUSTODY_INITIAL_RECEIPT_PATH: ${{ github.workspace }}/output/qualification/native-custody-initial-${{ matrix.admin_platform }}.json
          SERVICE_LASSO_QUALIFICATION_CUSTODY_RECEIPT_PATH: ${{ github.workspace }}/output/qualification/native-custody-closed-${{ matrix.admin_platform }}.json
          SERVICE_LASSO_QUALIFICATION_OWNED_PROCESS_EVENTS_PATH: ${{ github.workspace }}/output/qualification/native-owned-processes-${{ matrix.admin_platform }}.jsonl
        run: |
          set -euo pipefail
          mkdir -p "$SERVICE_LASSO_WORKSPACE_ROOT" "$SERVICE_LASSO_TEST_REGISTRIES_ROOT" "$SERVICE_LASSO_TEST_SERVICES_ROOT" "$SERVICE_LASSO_TEST_EVIDENCE_ROOT" "$SERVICE_LASSO_TEST_SUPPORT_ROOT"
          node scripts/qualification-custody.mjs initialize
          for name in SERVICE_LASSO_WORKSPACE_ROOT SERVICE_LASSO_TEST_REGISTRIES_ROOT SERVICE_LASSO_INSTANCE_REGISTRY_PATH SERVICE_LASSO_HOST_PORT_REGISTRY_PATH SERVICE_LASSO_TEST_SERVICES_ROOT SERVICE_LASSO_TEST_EVIDENCE_ROOT SERVICE_LASSO_TEST_SUPPORT_ROOT SERVICE_LASSO_QUALIFICATION_CUSTODY_INITIAL_RECEIPT_PATH SERVICE_LASSO_QUALIFICATION_CUSTODY_RECEIPT_PATH SERVICE_LASSO_QUALIFICATION_OWNED_PROCESS_EVENTS_PATH; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - name: Build Secrets Broker
        shell: bash
        working-directory: qualification/broker
        run: |
          set -euo pipefail
          mkdir -p output
          go build -trimpath -o "output/${{ matrix.broker_binary }}" ./cmd/secretsbroker
      - name: Build Service Lasso Core
        working-directory: qualification/core
        run: |
          npm ci
          npm run build
      - name: Install and qualify Service Admin candidate
        id: qualify
        shell: bash
        env:
          SERVICE_LASSO_TEST_CORE_ROOT: ${{ github.workspace }}/qualification/core
          SERVICE_LASSO_TEST_BROKER_BINARY: ${{ github.workspace }}/qualification/broker/output/${{ matrix.broker_binary }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec cypress install
          pnpm audit --prod
          pnpm build
          pnpm package:artifact -- "${{ matrix.admin_platform }}"
          pnpm package:verify -- "${{ matrix.admin_platform }}"
          node --test scripts/captured-child-close.node-test.mjs scripts/cypress-child-exit.node-test.mjs scripts/qualification-custody.node-test.mjs scripts/qualification-owned-process-custody.node-test.mjs scripts/real-browser-runtime-inputs.node-test.mjs
          pnpm test:secrets:trusted-unlock-receipt
          SERVICE_LASSO_TRUSTED_UNLOCK_REAL_PROVIDER_CONTROL=1 pnpm test:secrets:real-provider-validation-receipt
          pnpm test:secrets:real-first-run-browser
          pnpm test:secrets:real-browser
          pnpm test:secrets:real-stopped-lifecycle-browser
          if [[ "${{ matrix.admin_platform }}" == "win32" ]]; then
            pnpm test:secrets:real-lockout-browser
          fi
      - name: Finalize absent native custody as unverified
        if: always()
        shell: bash
        env:
          SERVICE_LASSO_QUALIFICATION_CUSTODY_INITIAL_RECEIPT_PATH: ${{ github.workspace }}/output/qualification/native-custody-initial-${{ matrix.admin_platform }}.json
          SERVICE_LASSO_QUALIFICATION_CUSTODY_RECEIPT_PATH: ${{ github.workspace }}/output/qualification/native-custody-closed-${{ matrix.admin_platform }}.json
        run: |
          set -euo pipefail
          node scripts/qualification-custody.mjs finalize
      - name: Write metadata-only browser evidence
        if: always()
        shell: bash
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualify.outcome }}
          QUALIFICATION_PLATFORM: ${{ matrix.admin_platform }}
          ADMIN_REVISION: ${{ steps.dependency_revisions.outputs.admin_revision }}
          CORE_REVISION: ${{ steps.dependency_revisions.outputs.core_revision }}
          BROKER_REVISION: ${{ steps.dependency_revisions.outputs.broker_revision }}
          CORE_QUALIFICATION_KIND: source_candidate
        run: |
          set -euo pipefail
          mkdir -p output/qualification
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'

          const safeToken = /^[a-z0-9._-]{1,128}$/i
          const exactRevision = /^[a-f0-9]{40}$/
          const required = (name) => {
            const value = process.env[name]?.trim()
            if (!value || !safeToken.test(value)) {
              throw new Error(`Invalid metadata-only evidence field: ${name}.`)
            }
            return value
          }
          const platform = required('QUALIFICATION_PLATFORM')
          const evidence = {
            schema: 'service-lasso.real-secrets-browser-evidence.v1',
            outcome: required('QUALIFICATION_OUTCOME'),
            platform,
            adminRevision: required('ADMIN_REVISION'),
            coreRevision: required('CORE_REVISION'),
            coreQualificationKind: required('CORE_QUALIFICATION_KIND'),
            publishedCoreBaseline: 'unavailable',
            brokerRevision: required('BROKER_REVISION'),
            runId: required('GITHUB_RUN_ID'),
            runAttempt: required('GITHUB_RUN_ATTEMPT'),
            retainedContent: 'metadata_only',
          }
          if (
            !exactRevision.test(evidence.adminRevision) ||
            !exactRevision.test(evidence.coreRevision) ||
            !exactRevision.test(evidence.brokerRevision)
          ) {
            throw new Error('Browser evidence revisions must be exact SHAs.')
          }
          await writeFile(
            `output/qualification/real-secrets-browser-${platform}.json`,
            `${JSON.stringify(evidence, null, 2)}\n`,
            { encoding: 'utf8', mode: 0o600 }
          )
          NODE
      - name: Retain metadata-only browser evidence and closed native custody
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serviceadmin-real-browser-${{ matrix.admin_platform }}
          path: |
            output/qualification/real-secrets-browser-${{ matrix.admin_platform }}.json
            output/qualification/native-custody-initial-${{ matrix.admin_platform }}.json
            output/qualification/native-custody-closed-${{ matrix.admin_platform }}.json
          if-no-files-found: error
          retention-days: 90
