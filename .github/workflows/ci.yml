name: Continuous Integration

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

jobs:
  install-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Lint the code
        run: pnpm lint

      # - name: Analyze unused files and dependencies
      #   run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build the project
        run: pnpm build

      - name: Verify packaged runtime
        run: pnpm test:runtime

      - name: Verify hosted Chrome
        run: google-chrome --version

      - name: Run browser UI tests
        timeout-minutes: 15
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm test:ui

      - name: Build and verify release artifact
        timeout-minutes: 15
        run: |
          pnpm package:artifact -- linux
          pnpm package:verify -- linux
